<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إصدار أمر بمهمة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 900px; margin: 30px auto; }
        .mission-card { background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        label { color: #cbd5e1; display: block; margin-bottom: 8px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; transition: border 0.3s; }
        input:focus, select:focus { border-color: #f59e0b; outline: none; }
        @media print { .btn, .page-header, .form-actions { display: none !important; } body { background: white !important; color: black !important; } .mission-card { border: none; background: white; color: black; box-shadow: none; } label { color: #333; } input, select, textarea { border: 1px solid #ccc; color: black; background: white; } }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

    <div class="container">
        <header class="page-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 class="page-title">📜 تحرير أمر بمهمة</h1>
            <a href="dashboard.html" class="btn btn-secondary">🔙 العودة للوحة التحكم</a>
        </header>

        <div class="mission-card fade-in">
            <form id="missionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>الرقم التسلسلي</label>
                        <input type="text" name="الرقم" required>
                    </div>

                    <div class="form-group">
                        <label>الرتبة (المرحلة التعليمية)</label>
                        <select id="rankSelect" name="الرتبة" required onchange="filterInspectorsByStage()">
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">مفتش التعليم الابتدائي</option>
                            <option value="متوسط">مفتش التعليم المتوسط</option>
                            <option value="ثانوي">مفتش التعليم الثانوي</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>الاسم واللقب (من عمود الاسم)</label>
                        <select id="inspectorSelect" name="الاسم واللقب" required>
                            <option value="">-- اختر المرحلة أولاً --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>الإقامة الإدارية</label>
                        <input type="text" name="الإقامة الإدارية" required>
                    </div>

                    <div class="form-group">
                        <label>مكان الملتقى</label>
                        <input type="text" name="مكان الملتقى" required>
                    </div>

                    <div class="form-group">
                        <label>تاريخ الذهاب</label>
                        <input type="date" name="تاريخ الذهاب" required>
                    </div>

                    <div class="form-group">
                        <label>تاريخ العودة</label>
                        <input type="date" name="تاريخ العودة" required>
                    </div>

                    <div class="form-group full-width">
                        <label>موضوع الملتقى</label>
                        <input type="text" name="موضوع الملتقى" required>
                    </div>

                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <textarea name="الملاحظة" rows="3"></textarea>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 30px; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-accent" id="submitBtn" style="background-color: #f59e0b;">💾 حفظ في الشيت</button>
                    <button type="button" class="btn btn-ghost" onclick="window.print()">🖨️ طباعة المعاينة</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYcwiQUJYKmMTKWFFpExIV_gDuRC2c-vSd6R7Ow-rsU24SGud6_6_qRl0YAV3BFwId/exec";

        async function filterInspectorsByStage() {
            const stage = document.getElementById('rankSelect').value;
            const inspectorSelect = document.getElementById('inspectorSelect');
            
            if (!stage) {
                inspectorSelect.innerHTML = '<option value="">-- اختر المرحلة أولاً --</option>';
                return;
            }

            inspectorSelect.innerHTML = '<option value="">⏳ جاري جلب المفتشين...</option>';

            try {
                // جلب المفتشين من data.js (الذي يجلبها من شيت المفتشين)
                const allInspectors = await fetchInspectors(true); 
                
                // التصفية بناءً على عمود "المرحلة" والمطابقة مع القيمة المختارة
                const filtered = allInspectors.filter(insp => {
                    const dbStage = (insp['المرحلة'] || "").toString().trim();
                    return dbStage === stage;
                });

                if (filtered.length > 0) {
                    inspectorSelect.innerHTML = '<option value="">-- اختر المفتش من القائمة --</option>';
                    filtered.forEach(insp => {
                        // إحضار الاسم من عمود "الاسم" كما طلبت
                        const name = insp['الاسم'] || insp['الاسم واللقب'] || "اسم غير معروف";
                        const option = document.createElement('option');
                        option.value = name;
                        option.textContent = name;
                        inspectorSelect.appendChild(option);
                    });
                } else {
                    inspectorSelect.innerHTML = `<option value="">⚠️ لا يوجد مفتشون في مرحلة (${stage})</option>`;
                }
            } catch (error) {
                console.error("Error:", error);
                inspectorSelect.innerHTML = '<option value="">❌ خطأ في تحميل البيانات</option>';
            }
        }

        document.getElementById('missionForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "⏳ جاري الحفظ...";

            const formData = new FormData(e.target);
            const params = new URLSearchParams();
            params.append("action", "insertMission");
            for (const pair of formData.entries()) { params.append(pair[0], pair[1]); }

            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params });
                alert("✅ تم تسجيل الأمر بمهمة بنجاح");
                e.target.reset();
                document.getElementById('inspectorSelect').innerHTML = '<option value="">-- اختر المرحلة أولاً --</option>';
            } catch (err) { alert("❌ حدث خطأ أثناء الإرسال"); } 
            finally { btn.disabled = false; btn.innerText = "💾 حفظ في الشيت"; }
        };
    </script>
</body>
</html>
