<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تعديل بيانات الزيارة</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .container { max-width: 800px; margin: 30px auto; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .loading-msg { text-align: center; padding: 20px; color: #2563eb; font-weight: bold; }
        #editForm { display: none; } /* يظهر بعد تحميل البيانات */
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

    <div class="container">
        <div class="header-actions">
            <h2>✏️ تعديل بيانات الزيارة</h2>
            <a href="visit.html" class="btn btn-secondary">🔙 العودة للسجل</a>
        </div>

        <div id="loadingMessage" class="loading-msg">⏳ جاري جلب بيانات السجل...</div>

        <div class="card fade-in" id="editCard">
            <form id="editForm">
                <input type="hidden" id="editId" name="المعرف">

                <div class="form-grid">
                    <div class="form-group">
                        <label>اسم المعني بالزيارة</label>
                        <input type="text" id="visitee" name="اسم المعني بالزيارة" required />
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <input type="text" id="institution" name="المؤسسة" required />
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <input type="text" id="inspector" name="اسم المفتش" required />
                    </div>
                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" id="vDate" name="تاريخ الزيارة" required />
                    </div>
                    <div class="form-group">
                        <label>النقطة</label>
                        <input type="number" id="score" name="النقطة" step="0.25" required />
                    </div>
                    <div class="form-group">
                        <label>العقبات / الإجازات</label>
                        <select name="العقبات" id="penalties">
                            <option value="لا شيء">لا شيء</option>
                            <option value="إقتراح إنذار">إقتراح إنذار</option>
                            <option value="إقتراح توبيخ">إقتراح توبيخ</option>
                            <option value="إقتراح تشجيع">إقتراح تشجيع</option>
                            <option value="إقتراح ترسيم">إقتراح ترسيم</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <textarea id="notes" name="الملاحظة" rows="3" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ddd;"></textarea>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-accent" id="saveBtn">💾 حفظ التعديلات النهائية</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    // الرابط الذي زودتني به
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNxA-jsBPMeguI5kaP8L8h5xldssUvhrSTgkTLV0xQGxQ3e-OOWR8ZRBqXr8OLJUes/exec";

    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('id');

        if (!recordId) {
            alert("خطأ: لم يتم تحديد سجل للتعديل.");
            window.location.href = 'visit.html';
            return;
        }

        // جلب البيانات لعرضها في الحقول
        try {
            const resp = await fetch(`${SCRIPT_URL}?action=get&sheetName=visit`);
            const data = await resp.json();
            // البحث عن السجل (تأكد أن اسم العمود في الشيت هو 'المعرف')
            const record = data.find(item => String(item['المعرف']) === String(recordId));

            if (record) {
                document.getElementById('editId').value = record['المعرف'];
                document.getElementById('visitee').value = record['اسم المعني بالزيارة'] || '';
                document.getElementById('institution').value = record['المؤسسة'] || '';
                document.getElementById('inspector').value = record['اسم المفتش'] || '';
                document.getElementById('score').value = record['النقطة'] || 0;
                document.getElementById('penalties').value = record['العقبات'] || 'لا شيء';
                document.getElementById('notes').value = record['الملاحظة'] || '';
                
                if (record['تاريخ الزيارة']) {
                    const d = new Date(record['تاريخ الزيارة']);
                    document.getElementById('vDate').value = d.toISOString().split('T')[0];
                }
                
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('editForm').style.display = 'block';
            }
        } catch (e) { alert("خطأ في جلب البيانات"); }
    });

    // --- الجزء الأهم: إرسال التعديل للشيت ---
    document.getElementById('editForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "⏳ جاري التحديث في الشيت...";

        // تجهيز الرابط مع كل المعطيات (Query Parameters)
        // ملاحظة: نستخدم GET هنا لأن أغلب سكريبتات جوجل البسيطة تستقبل التحديث عبرها لتجنب مشاكل CORS
        const params = new URLSearchParams({
            action: "update",
            sheetName: "visits", // تأكد أنها visits وليس visit
            "المعرف": document.getElementById('editId').value,
            "اسم المعني بالزيارة": document.getElementById('visitee').value,
            "المؤسسة": document.getElementById('institution').value,
            "اسم المفتش": document.getElementById('inspector').value,
            "تاريخ الزيارة": document.getElementById('vDate').value,
            "النقطة": document.getElementById('score').value,
            "العقبات": document.getElementById('penalties').value,
            "الملاحظة": document.getElementById('notes').value
        });

        try {
            // إرسال الطلب
            await fetch(`${SCRIPT_URL}?${params.toString()}`, { method: 'POST', mode: 'no-cors' });
            
            alert("✅ تم تحديث البيانات بنجاح في الشيت الرئيسي");
            window.location.href = 'visit.html'; 
        } catch (error) {
            alert("❌ حدث خطأ أثناء الاتصال بالخادم");
            btn.disabled = false;
            btn.innerText = "💾 حفظ التعديلات النهائية";
        }
    };
</script>
</body>
</html>
