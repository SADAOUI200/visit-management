<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة المؤسسات – نظام إدارة الزيارات التفتيشية</title>
    <meta name="description" content="إضافة وعرض المؤسسات التعليمية" />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>" />
    <link rel="stylesheet" href="style.css" />
    <style>
        /* تحسينات بسيطة لأزرار الترقيم والإجراءات لضمان مظهر احترافي */
        .pagination-wrapper { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; padding: 10px; flex-wrap: wrap; }
        .pagination-wrapper button { min-width: 80px; }
        .action-btns { display: flex; gap: 5px; justify-content: center; }
        .btn-edit { background-color: #f59e0b !important; color: white !important; border: none; }
        .btn-delete { background-color: #ef4444 !important; color: white !important; border: none; }
    </style>
</head>

<body>
    <div class="loader-overlay" id="loaderOverlay">
        <div class="spinner"></div>
    </div>

    <nav class="navbar">
        <div class="brand">
            <span>🏫</span> نظام إدارة الزيارات التفتيشية
        </div>
        <div class="nav-links">
            <span class="user-info" id="navUserInfo"></span>
            <a href="dashboard.html" class="btn btn-ghost btn-sm">⚙️ لوحة التحكم</a>
            <a href="visit.html" class="btn btn-ghost btn-sm">📋 الزيارات</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <header class="page-header">
            <h1 class="page-title">🏢 إدارة المؤسسات التعليمية</h1>
            <p class="page-subtitle">إضافة وتعديل بيانات المؤسسات في المقاطعة</p>
        </header>

        <div class="card fade-in">
            <div class="card-title">➕ إضافة مؤسسة جديدة</div>
            <form id="institutionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="instMunicipality">البلدية</label>
                        <select id="instMunicipality" name="municipality" required>
                            </select>
                    </div>
                    <div class="form-group">
                        <label for="instName">اسم المؤسسة</label>
                        <input type="text" id="instName" name="name" placeholder="مثال: مدرسة الشهيد..." required />
                    </div>
                    <div class="form-group">
                        <label for="instLevel">المرحلة التعليمية</label>
                        <select id="instLevel" name="level" required>
                            </select>
                    </div>
                    <div class="form-group">
                        <label for="instManager">مدير المؤسسة</label>
                        <input type="text" id="instManager" name="manager" placeholder="الاسم واللقب" required />
                    </div>
                    <div class="form-group">
                        <label for="instFinancial">المسيّر المالي</label>
                        <input type="text" id="instFinancial" name="financialManager" placeholder="الاسم واللقب" />
                    </div>
                </div>
                <div class="form-actions">
                    <button type="reset" class="btn btn-ghost">إعادة تعيين</button>
                    <button type="submit" class="btn btn-accent">📥 حفظ المؤسسة</button>
                </div>
            </form>
        </div>

        <div class="card fade-in" style="margin-top: 2rem;">
            <div class="card-header-flex">
                <div class="card-title">📋 قائمة المؤسسات المسجلة</div>
                <div class="stats-badge" id="instCount">0 مؤسسة</div>
            </div>

            <div class="search-grid">
                <div class="form-group">
                    <input type="text" id="searchInstName" placeholder="🔍 بحث باسم المؤسسة..." />
                </div>
                <div class="form-group">
                    <input type="text" id="searchInstMunicipality" placeholder="📍 بحث بالبلدية..." />
                </div>
                <div class="form-group">
                    <select id="searchInstLevel">
                        <option value="">-- كل المراحل --</option>
                        <option>ابتدائي</option>
                        <option>متوسط</option>
                        <option>ثانوي</option>
                    </select>
                </div>
                <div class="form-group" style="align-self:flex-end;">
                    <button class="btn btn-ghost" onclick="clearInstSearch()" style="width:100%;">✕ مسح البحث</button>
                </div>
            </div>

            <div class="table-wrap">
                <table id="institutionsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>البلدية</th>
                            <th>اسم المؤسسة</th>
                            <th>المرحلة</th>
                            <th>مدير المؤسسة</th>
                            <th>المسيّر المالي</th>
                            <th style="text-align: center;">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="institutionsTableBody">
                        <tr>
                            <td colspan="7" class="empty-state">
                                <span class="icon">⏳</span>جارٍ تحميل البيانات...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="paginationControls" class="pagination-wrapper"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script src="institutions.js"></script>
</body>
</html>
