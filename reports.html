<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حوصلة التقارير التفتيشية</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- مكتبات التصدير (Excel و PDF) -->
    <script>
    let allVisitsData = [];
    let inspectorsData = [];

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // 1. جلب بيانات المفتشين
            if (typeof fetchInspectors === 'function') {
                inspectorsData = await fetchInspectors();
            }

            // 2. جلب بيانات الزيارات بمرونة (سواء من الدالة أو من Storage)
            if (typeof getVisits === 'function') {
                allVisitsData = await getVisits();
            } else if (localStorage.getItem('visits')) {
                allVisitsData = JSON.parse(localStorage.getItem('visits'));
            }

            console.log("إجمالي البيانات المحملة:", allVisitsData);
        } catch (e) {
            console.error("خطأ في جلب البيانات:", e);
        }
    });

    function toggleReportOptions() {
        const type = document.getElementById('reportType').value;
        document.getElementById('stageBox').style.display = (type === 'individual' || type === 'subjects') ? 'block' : 'none';
        document.getElementById('inspectorBox').style.display = (type === 'individual') ? 'block' : 'none';
    }

    async function loadInspectorsByStage() {
        const stage = document.getElementById('stageFilter').value;
        const insSel = document.getElementById('inspectorFilter');
        insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
        
        const filtered = inspectorsData.filter(i => (i['المرحلة'] || i.stage) === stage);
        filtered.forEach(i => insSel.add(new Option(i['الاسم'] || i.name, i['الاسم'] || i.name)));
    }

    // دالة مرنة ومستقلة لمعالجة وقراءة قيم السجلات بجميع تسمياتها
    function getValue(item, keys) {
        for (let key of keys) {
            if (item && item[key] !== undefined && item[key] !== null && item[key] !== '') {
                return String(item[key]).trim();
            }
        }
        return '';
    }

    // دالة الفحص المرن للموسم الدراسي
    function isMatchingSeason(visitSeason, searchInput) {
        if (!searchInput || !searchInput.trim()) return true;
        if (!visitSeason) return false;

        const inputNums = searchInput.match(/\d+/g) || [];
        const visitNums = String(visitSeason).match(/\d+/g) || [];

        if (inputNums.length === 0) {
            return String(visitSeason).includes(searchInput.trim());
        }

        return inputNums.some(num => visitNums.includes(num));
    }

    function generateReport() {
        const type = document.getElementById('reportType').value;
        const seasonInput = document.getElementById('reportSeason').value;
        const state = document.getElementById('reportState').value;
        const container = document.getElementById('reportOutput');
        container.innerHTML = '';

        // تصفية الزيارات حسب الموسم
        const visits = allVisitsData.filter(v => {
            const vSeason = getValue(v, ['season', 'الموسم', 'الموسم الدراسي']);
            return isMatchingSeason(vSeason, seasonInput);
        });

        console.log("الزيارات المفلترة للموسم:", visits);

        if (type === 'season') {
            renderSeasonReport(visits, seasonInput, state, container);
        } else if (type === 'individual') {
            const inspector = document.getElementById('inspectorFilter').value;
            if (!inspector) { alert('الرجاء اختيار المفتش'); return; }
            renderIndividualReport(visits, inspector, seasonInput, state, container);
        } else if (type === 'subjects') {
            renderSubjectsReport(visits, seasonInput, state, container);
        }
    }

    // 1. تقرير الموسم الكامل
    function renderSeasonReport(visits, seasonText, state, container) {
        const inspectorsMap = {};

        visits.forEach(v => {
            const insp = getValue(v, ['inspector', 'المفتش', 'اسم المفتش']);
            const inst = getValue(v, ['institution', 'المؤسسة', 'اسم المؤسسة']);
            
            if (!insp || !inst) return;

            if (!inspectorsMap[insp]) inspectorsMap[insp] = {};
            if (!inspectorsMap[insp][inst]) inspectorsMap[insp][inst] = 0;
            inspectorsMap[insp][inst]++;
        });

        const inspectorsList = Object.keys(inspectorsMap);
        if (inspectorsList.length === 0) {
            container.innerHTML = '<div style="text-align:center; font-weight:bold; padding:40px; color:#dc2626;">⚠️ لم يتم العثور على أية إحصائيات مطابقة لبيانات الموسم المدخل.</div>';
            return;
        }

        inspectorsList.forEach(inspName => {
            const page = document.createElement('div');
            page.className = 'report-page';

            let totalVisits = 0;
            let rowsHtml = '';
            let index = 1;

            for (const [inst, count] of Object.entries(inspectorsMap[inspName])) {
                totalVisits += count;
                rowsHtml += `<tr>
                    <td>${index++}</td>
                    <td style="text-align:right;">${inst}</td>
                    <td>${count}</td>
                </tr>`;
            }

            page.innerHTML = `
                <div class="official-header">
                    <div class="republic">الجمهورية الجزائرية الديمقراطية الشعبية</div>
                    <div class="ministry">وزارة التربية الوطنية</div>
                    <div class="directorate">مديرية التربية لولاية : ${state}</div>
                </div>
                <div class="report-title">حصيلة الزيارات التفتيشية للموسم الدراسي ${seasonText}</div>
                <div class="inspector-info">اسم السيد المفتش: ${inspName}</div>
                <table class="report-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">#</th>
                            <th>اسم المؤسسة المزارة</th>
                            <th style="width: 25%;">عدد الزيارات</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHtml}
                        <tr class="total-row">
                            <td colspan="2" style="text-align:left; padding-left:20px;">مجموع الزيارات:</td>
                            <td>${totalVisits}</td>
                        </tr>
                    </tbody>
                </table>
            `;
            container.appendChild(page);
        });
    }

    // 2. تقرير فردي لمفتش
    function renderIndividualReport(visits, inspectorName, seasonText, state, container) {
        const inspVisits = visits.filter(v => getValue(v, ['inspector', 'المفتش']) === inspectorName);
        const instMap = {};
        let total = 0;

        inspVisits.forEach(v => {
            const inst = getValue(v, ['institution', 'المؤسسة']);
            if (inst) {
                instMap[inst] = (instMap[inst] || 0) + 1;
                total++;
            }
        });

        const page = document.createElement('div');
        page.className = 'report-page';

        let rows = '';
        let idx = 1;
        for (const [inst, count] of Object.entries(instMap)) {
            rows += `<tr><td>${idx++}</td><td style="text-align:right;">${inst}</td><td>${count}</td></tr>`;
        }

        page.innerHTML = `
            <div class="official-header">
                <div class="republic">الجمهورية الجزائرية الديمقراطية الشعبية</div>
                <div class="ministry">وزارة التربية الوطنية</div>
                <div class="directorate">مديرية التربية لولاية : ${state}</div>
            </div>
            <div class="report-title">تقرير حصيلة الزيارات التفتيشية الفردية (${seasonText})</div>
            <div class="inspector-info">المفتش: ${inspectorName}</div>
            <table class="report-table">
                <thead><tr><th>#</th><th>المؤسسة المزارة</th><th>عدد الزيارات</th></tr></thead>
                <tbody>
                    ${rows || '<tr><td colspan="3">لا توجد زيارات مسجلة لهذا المفتش</td></tr>'}
                    <tr class="total-row"><td colspan="2">المجموع الكلي:</td><td>${total}</td></tr>
                </tbody>
            </table>
        `;
        container.appendChild(page);
    }

    // 3. تقرير الزيارات حسب المواد (المرحلة الثانوية)
    function renderSubjectsReport(visits, seasonText, state, container) {
        const secVisits = visits.filter(v => getValue(v, ['stage', 'المرحلة']) === 'ثانوي');
        
        const subjectsSet = new Set();
        const institutionsSet = new Set();
        const matrix = {};

        secVisits.forEach(v => {
            const subj = getValue(v, ['specialty', 'التخصص']) || 'غير محدد';
            const inst = getValue(v, ['institution', 'المؤسسة']) || 'غير محددة';
            
            subjectsSet.add(subj);
            institutionsSet.add(inst);

            if (!matrix[inst]) matrix[inst] = {};
            matrix[inst][subj] = (matrix[inst][subj] || 0) + 1;
        });

        const subjectsList = Array.from(subjectsSet);
        const institutionsList = Array.from(institutionsSet);

        const page = document.createElement('div');
        page.className = 'report-page';

        let headerHtml = '<tr><th>المؤسسة / المادة</th>';
        subjectsList.forEach(sub => { headerHtml += `<th>${sub}</th>`; });
        headerHtml += '<th>مجموع المؤسسة</th></tr>';

        let bodyHtml = '';
        const subjectTotals = {};
        subjectsList.forEach(s => subjectTotals[s] = 0);
        let grandTotal = 0;

        institutionsList.forEach(inst => {
            let instTotal = 0;
            bodyHtml += `<tr><td style="text-align:right; font-weight:bold;">${inst}</td>`;
            
            subjectsList.forEach(sub => {
                const count = matrix[inst][sub] || 0;
                instTotal += count;
                subjectTotals[sub] += count;
                bodyHtml += `<td>${count || '-'}</td>`;
            });
            
            grandTotal += instTotal;
            bodyHtml += `<td style="font-weight:bold; background:#f8fafc;">${instTotal}</td></tr>`;
        });

        let footerHtml = '<tr class="total-row"><td>مجموع المادة</td>';
        subjectsList.forEach(sub => {
            footerHtml += `<td>${subjectTotals[sub]}</td>`;
        });
        footerHtml += `<td>${grandTotal}</td></tr>`;

        page.innerHTML = `
            <div class="official-header">
                <div class="republic">الجمهورية الجزائرية الديمقراطية الشعبية</div>
                <div class="ministry">وزارة التربية الوطنية</div>
                <div class="directorate">مديرية التربية لولاية : ${state}</div>
            </div>
            <div class="report-title">حوصلة الزيارات التفتيشية حسب المواد (المرحلة الثانوية) - ${seasonText}</div>
            <div style="overflow-x: auto;">
                <table class="report-table">
                    <thead>${headerHtml}</thead>
                    <tbody>${bodyHtml || '<tr><td colspan="100%">لا توجد زيارات مسجلة للمرحلة الثانوية في هذا الموسم</td></tr>'}</tbody>
                    <tfoot>${footerHtml}</tfoot>
                </table>
            </div>
        `;
        container.appendChild(page);
    }

    // تصدير إلى Excel
    function exportToExcel() {
        const tables = document.querySelectorAll('.report-table');
        if (tables.length === 0) { alert('الرجاء عرض التقرير أولاً'); return; }

        const wb = XLSX.utils.book_new();
        tables.forEach((table, index) => {
            const ws = XLSX.utils.table_to_sheet(table);
            XLSX.utils.book_append_sheet(wb, ws, `تقرير_${index + 1}`);
        });
        XLSX.writeFile(wb, `تقرير_الزيارات_${new Date().toISOString().split('T')[0]}.xlsx`);
    }

    // تصدير إلى PDF
    function exportToPDF() {
        const element = document.getElementById('reportOutput');
        if (!element || element.children.length === 0) { alert('الرجاء عرض التقرير أولاً'); return; }

        const opt = {
            margin:       10,
            filename:     `تقرير_الزيارات_${new Date().toISOString().split('T')[0]}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save();
    }
</script>
</body>
</html>
