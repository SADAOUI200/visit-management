<script src="app.js"></script>
<script src="data.js"></script>
<script src="visit.js"></script>

<script>
    let allVisitsData = [];
    let inspectorsData = [];

    // دالة مرنة جداً لجلب أي قيمة من الكائن بغض النظر عن التسمية
    function getVal(obj, possibleNames) {
        if (!obj || typeof obj !== 'object') return '';
        
        // 1. تجربة الدالة الخاصة بك إن وجدت
        if (typeof getField === 'function') {
            for (let name of possibleNames) {
                let v = getField(obj, name);
                if (v !== undefined && v !== null && v !== '') return String(v).trim();
            }
        }

        // 2. مطابقة مباشرة أو جزئية للمفاتيح
        const keys = Object.keys(obj);
        for (let target of possibleNames) {
            // مطابقة مطابقة تامة
            if (obj[target] !== undefined && obj[target] !== null && obj[target] !== '') {
                return String(obj[target]).trim();
            }
            // مطابقة جزئية (تتجاهل المسافات وتغطي الاختلافات)
            let foundKey = keys.find(k => k.replace(/\s+/g, '').includes(target.replace(/\s+/g, '')));
            if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== null && obj[foundKey] !== '') {
                return String(obj[foundKey]).trim();
            }
        }
        return '';
    }

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            // 1. جلب المفتشين
            if (typeof fetchInspectors === 'function') {
                inspectorsData = await fetchInspectors();
            }

            // 2. جلب الزيارات بطريقة مضمونة المباشرة والاحتياطية
            if (typeof getVisits === 'function') {
                allVisitsData = await getVisits();
            } else if (typeof loadVisits === 'function') {
                await loadVisits();
                if (typeof allVisits !== 'undefined') allVisitsData = allVisits;
            } else if (localStorage.getItem('visits')) {
                allVisitsData = JSON.parse(localStorage.getItem('visits'));
            }

            // إذا لم يتم الجلب، نحاول الاتصال المباشر بالرابط
            if ((!allVisitsData || allVisitsData.length === 0) && typeof SCRIPT_URL !== 'undefined') {
                const res = await fetch(`${SCRIPT_URL}?action=getVisits`);
                const json = await res.json();
                allVisitsData = json.data || json;
            }

            console.log("تم تحميل الزيارات:", allVisitsData);
        } catch (e) {
            console.error("خطأ أثناء تحميل البيانات:", e);
        }
    });

    function toggleReportOptions() {
        const type = document.getElementById('reportType').value;
        document.getElementById('stageBox').style.display = (type === 'individual' || type === 'subjects') ? 'block' : 'none';
        document.getElementById('inspectorBox').style.display = (type === 'individual') ? 'block' : 'none';
    }

    async function loadInspectorsByStage() {
        const stage = document.getElementById('stageFilter').value;
        const insSel = document.getElementById('inspectorFilter');
        insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
        
        const filtered = inspectorsData.filter(i => getVal(i, ['المرحلة', 'stage']) === stage);
        filtered.forEach(i => {
            const name = getVal(i, ['الاسم', 'اسم المفتش', 'name']);
            if (name) insSel.add(new Option(name, name));
        });
    }

    // مطابقة السنوات والمواسم
    function isMatchingSeason(visitSeason, searchInput) {
        if (!searchInput || !searchInput.trim()) return true;
        if (!visitSeason) return false;

        const inputNums = searchInput.match(/\d+/g) || [];
        const visitNums = String(visitSeason).match(/\d+/g) || [];

        if (inputNums.length === 0) return String(visitSeason).includes(searchInput.trim());
        return inputNums.some(num => visitNums.includes(num));
    }

    // استخراج تخصص المفتش
    function getInspectorSpecialty(visit) {
        let spec = getVal(visit, ['التخصص', 'تخصص', 'specialty']);
        if (spec) return spec;

        const inspName = getVal(visit, ['اسم المفتش', 'المفتش', 'inspector']);
        if (inspName && inspectorsData.length > 0) {
            const found = inspectorsData.find(i => getVal(i, ['الاسم', 'اسم المفتش', 'name']) === inspName);
            if (found) return getVal(found, ['التخصص', 'تخصص', 'specialty']);
        }
        return 'غير محدد';
    }

    function generateReport() {
        const type = document.getElementById('reportType').value;
        const seasonInput = document.getElementById('reportSeason').value;
        const state = document.getElementById('reportState').value;
        const container = document.getElementById('reportOutput');
        container.innerHTML = '';

        // تأكيد وجود البيانات
        if (!allVisitsData || allVisitsData.length === 0) {
            alert('⚠️ لم يتم العثور على أي زيارات محمّلة! تحقق من الاتصال بالإنترنت أو رابط شيت جوجل.');
            return;
        }

        // تصفية الزيارات حسب الموسم
        const visits = allVisitsData.filter(v => {
            const vSeason = getVal(v, ['الموسم الدراسي', 'الموسم', 'season']);
            return isMatchingSeason(vSeason, seasonInput);
        });

        if (visits.length === 0) {
            alert(`⚠️ تم تحميل ${allVisitsData.length} زيارة، لكن لا توجد أية زيارة تطابق الموسم (${seasonInput})!`);
            return;
        }

        if (type === 'season') {
            renderSeasonReport(visits, seasonInput, state, container);
        } else if (type === 'individual') {
            const inspector = document.getElementById('inspectorFilter').value;
            if (!inspector) { alert('الرجاء اختيار المفتش أولاً'); return; }
            renderIndividualReport(visits, inspector, seasonInput, state, container);
        } else if (type === 'subjects') {
            renderSubjectsReport(visits, seasonInput, state, container);
        }
    }

    // 1. تقرير الموسم الشامل
    function renderSeasonReport(visits, seasonText, state, container) {
        const inspectorsMap = {};

        visits.forEach(v => {
            const insp = getVal(v, ['اسم المفتش', 'المفتش', 'inspector']);
            const inst = getVal(v, ['المؤسسة', 'اسم المؤسسة', 'institution']);
            
            if (!insp || !inst) return;

            if (!inspectorsMap[insp]) inspectorsMap[insp] = {};
            if (!inspectorsMap[insp][inst]) inspectorsMap[insp][inst] = 0;
            inspectorsMap[insp][inst]++;
        });

        const inspectorsList = Object.keys(inspectorsMap);
        if (inspectorsList.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:30px; color:red; font-weight:bold;">⚠️ لم يتم التعرف على أسماء المفتشين أو المؤسسات في البيانات.</div>';
            return;
        }

        inspectorsList.forEach(inspName => {
            const page = document.createElement('div');
            page.className = 'report-page';

            let totalVisits = 0;
            let rowsHtml = '';
            let index = 1;

            for (const [inst, count] of Object.entries(inspectorsMap[inspName])) {
                totalVisits += count;
                rowsHtml += `<tr><td>${index++}</td><td style="text-align:right;">${inst}</td><td>${count}</td></tr>`;
            }

            page.innerHTML = `
                <div class="official-header">
                    <div class="republic">الجمهورية الجزائرية الديمقراطية الشعبية</div>
                    <div class="ministry">وزارة التربية الوطنية</div>
                    <div class="directorate">مديرية التربية لولاية : ${state}</div>
                </div>
                <div class="report-title">حصيلة الزيارات التفتيشية للموسم الدراسي ${seasonText}</div>
                <div class="inspector-info">اسم السيد المفتش: ${inspName}</div>
                <table class="report-table">
                    <thead><tr><th style="width: 10%;">#</th><th>اسم المؤسسة المزارة</th><th style="width: 25%;">عدد الزيارات</th></tr></thead>
                    <tbody>${rowsHtml}<tr class="total-row"><td colspan="2" style="text-align:left; padding-left:20px;">مجموع الزيارات:</td><td>${totalVisits}</td></tr></tbody>
                </table>
            `;
            container.appendChild(page);
        });
    }

    // 2. التقرير الفردي
    function renderIndividualReport(visits, inspectorName, seasonText, state, container) {
        const inspVisits = visits.filter(v => getVal(v, ['اسم المفتش', 'المفتش', 'inspector']) === inspectorName);
        const instMap = {};
        let total = 0;

        inspVisits.forEach(v => {
            const inst = getVal(v, ['المؤسسة', 'اسم المؤسسة', 'institution']);
            if (inst) {
                instMap[inst] = (instMap[inst] || 0) + 1;
                total++;
            }
        });

        const page = document.createElement('div');
        page.className = 'report-page';

        let rows = '';
        let idx = 1;
        for (const [inst, count] of Object.entries(instMap)) {
            rows += `<tr><td>${idx++}</td><td style="text-align:right;">${inst}</td><td>${count}</td></tr>`;
        }

        page.innerHTML = `
            <div class="official-header">
                <div class="republic">الجمهورية الجزائرية الديمقراطية الشعبية</div>
                <div class="ministry">وزارة التربية الوطنية</div>
                <div class="directorate">مديرية التربية لولاية : ${state}</div>
            </div>
            <div class="report-title">تقرير حصيلة الزيارات التفتيشية الفردية (${seasonText})</div>
            <div class="inspector-info">المفتش: ${inspectorName}</div>
            <table class="report-table">
                <thead><tr><th>#</th><th>المؤسسة المزارة</th><th>عدد الزيارات</th></tr></thead>
                <tbody>
                    ${rows || '<tr><td colspan="3">لا توجد زيارات مسجلة لهذا المفتش</td></tr>'}
                    <tr class="total-row"><td colspan="2">المجموع الكلي:</td><td>${total}</td></tr>
                </tbody>
            </table>
        `;
        container.appendChild(page);
    }

    // 3. التقرير المجمع حسب تخصص المفتش (المادة)
    function renderSubjectsReport(visits, seasonText, state, container) {
        const secVisits = visits.filter(v => getVal(v, ['المرحلة التعليمية', 'المرحلة', 'stage']) === 'ثانوي');
        
        const subjectsSet = new Set();
        const institutionsSet = new Set();
        const matrix = {};

        secVisits.forEach(v => {
            const subj = getInspectorSpecialty(v);
            const inst = getVal(v, ['المؤسسة', 'اسم المؤسسة', 'institution']) || 'غير محددة';
            
            subjectsSet.add(subj);
            institutionsSet.add(inst);

            if (!matrix[inst]) matrix[inst] = {};
            matrix[inst][subj] = (matrix[inst][subj] || 0) + 1;
        });

        const subjectsList = Array.from(subjectsSet).sort();
        const institutionsList = Array.from(institutionsSet).sort();

        const page = document.createElement('div');
        page.className = 'report-page';

        if (institutionsList.length === 0) {
            page.innerHTML = '<div style="text-align:center; padding:30px; font-weight:bold; color:#dc2626;">⚠️ لا توجد زيارات مسجلة للمرحلة الثانوية لهذا الموسم.</div>';
            container.appendChild(page);
            return;
        }

        let headerHtml = '<tr><th>المؤسسة / تخصص المفتش (المادة)</th>';
        subjectsList.forEach(sub => { headerHtml += `<th>${sub}</th>`; });
        headerHtml += '<th>مجموع المؤسسة</th></tr>';

        let bodyHtml = '';
        const subjectTotals = {};
        subjectsList.forEach(s => subjectTotals[s] = 0);
        let grandTotal = 0;

        institutionsList.forEach(inst => {
            let instTotal = 0;
            bodyHtml += `<tr><td style="text-align:right; font-weight:bold;">${inst}</td>`;
            
            subjectsList.forEach(sub => {
                const count = matrix[inst][sub] || 0;
                instTotal += count;
                subjectTotals[sub] += count;
                bodyHtml += `<td>${count || '-'}</td>`;
            });
            
            grandTotal += instTotal;
            bodyHtml += `<td style="font-weight:bold; background:#f8fafc;">${instTotal}</td></tr>`;
        });

        let footerHtml = '<tr class="total-row"><td>مجموع زيارات المادة</td>';
        subjectsList.forEach(sub => { footerHtml += `<td>${subjectTotals[sub]}</td>`; });
        footerHtml += `<td>${grandTotal}</td></tr>`;

        page.innerHTML = `
            <div class="official-header">
                <div class="republic">الجمهورية الجزائرية الديمقراطية الشعبية</div>
                <div class="ministry">وزارة التربية الوطنية</div>
                <div class="directorate">مديرية التربية لولاية : ${state}</div>
            </div>
            <div class="report-title">حوصلة الزيارات التفتيشية حسب مواد المفتشين (المرحلة الثانوية) - ${seasonText}</div>
            <div style="overflow-x: auto;">
                <table class="report-table">
                    <thead>${headerHtml}</thead>
                    <tbody>${bodyHtml}</tbody>
                    <tfoot>${footerHtml}</tfoot>
                </table>
            </div>
        `;
        container.appendChild(page);
    }
</script>
