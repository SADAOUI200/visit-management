<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم – نظام إدارة الزيارات</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* تنسيق الأزرار الزاهية */
        .btn-inspectors { color: #8b5cf6 !important; border: 1px solid #8b5cf6 !important; }
        .btn-institutions { color: #6366f1 !important; border: 1px solid #6366f1 !important; }
        .btn-visits { color: #14b8a6 !important; border: 1px solid #14b8a6 !important; }
        
        .level-stats {
            margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 5px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;
        }
        .level-item { text-align: center; }
        .level-count { display: block; font-weight: bold; color: #14b8a6; font-size: 1.1rem; }
        .level-name { font-size: 0.7rem; color: var(--text-muted); }

        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e293b; margin: 5% auto; padding: 2rem; border-radius: 12px;
            width: 90%; max-width: 450px; border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="brand"><span>🏫</span> نظام إدارة الزيارات التفتيشية</div>
        <div class="nav-links">
            <span class="user-info" id="navUserInfo"></span>
            <a href="inspectors.html" class="btn btn-ghost btn-sm btn-inspectors">🔍 المفتشين</a>
            <a href="institutions.html" class="btn btn-ghost btn-sm btn-institutions">🏢 المؤسسات</a>
            <a href="visit.html" class="btn btn-ghost btn-sm btn-visits">📋 الزيارات</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج 🚪</button>
        </div>
    </nav>

    <div class="container">
        <header class="page-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h1 class="page-title">⚙️ لوحة تحكم المدير</h1>
            <button class="btn btn-accent" onclick="document.getElementById('accountModal').style.display='block'">➕ إضافة حساب جديد</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card fade-in">
                <div class="stat-icon" style="background: rgba(99,102,241,0.1); color:#6366f1;">🏢</div>
                <div class="stat-info">
                    <div class="stat-value" id="count-inst">0</div>
                    <div class="stat-label">المؤسسات</div>
                </div>
            </div>
            <div class="stat-card fade-in">
                <div class="stat-icon" style="background: rgba(139,92,246,0.1); color:#8b5cf6;">🔍</div>
                <div class="stat-info">
                    <div class="stat-value" id="count-insp">0</div>
                    <div class="stat-label">المفتشين</div>
                </div>
            </div>
            <div class="stat-card fade-in">
                <div class="stat-icon" style="background: rgba(20,184,166,0.1); color:#14b8a6;">📋</div>
                <div class="stat-info">
                    <div class="stat-value" id="count-visits">0</div>
                    <div class="stat-label">إجمالي الزيارات</div>
                    <div class="level-stats">
                        <div class="level-item"><span class="level-count" id="v-pri">0</span><span class="level-name">ابتدائي</span></div>
                        <div class="level-item"><span class="level-count" id="v-mid">0</span><span class="level-name">متوسط</span></div>
                        <div class="level-item"><span class="level-count" id="v-sec">0</span><span class="level-name">ثانوي</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="accountModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem; color: white;">👤 إضافة حساب لـ Google Sheets</h3>
            <form id="gsForm">
                <div class="form-group"><label>الاسم الكامل</label><input type="text" id="fullName" required></div>
                <div class="form-group"><label>اسم الدخول</label><input type="text" id="loginUser" required></div>
                <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPass" required></div>
                <div class="form-group">
                    <label>الدور</label>
                    <select id="userRole"><option value="user">مستخدم</option><option value="admin">مدير</option></select>
                </div>
                <div class="form-actions" style="margin-top: 1rem;">
                    <button type="button" class="btn btn-ghost" onclick="document.getElementById('accountModal').style.display='none'">إلغاء</button>
                    <button type="submit" class="btn btn-accent" id="submitBtn">حفظ في الشيت</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzCXs7AZFWk6b1LrKuI2uaQXqRJzwsVOg6MOifXdWjerUkydW9FGLwa_m1-AMGyqHfXnQ/exec";

        // تحديث الإحصائيات من ملف الزيارات والبيانات
        async function loadStats() {
            try {
                // جلب البيانات الفعلية
                const insts = await fetchInstitutions(true);
                const insps = await fetchInspectors(true);
                const visits = await fetchVisits(true); // جلب من ملف الزيارات

                document.getElementById('count-inst').innerText = insts.length;
                document.getElementById('count-insp').innerText = insps.length;
                document.getElementById('count-visits').innerText = visits.length;

                let p=0, m=0, s=0;
                visits.forEach(v => {
                    const level = (v['المرحلة'] || v['level'] || '').trim();
                    if(level === 'ابتدائي') p++;
                    else if(level === 'متوسط') m++;
                    else if(level === 'ثانوي') s++;
                });
                document.getElementById('v-pri').innerText = p;
                document.getElementById('v-mid').innerText = m;
                document.getElementById('v-sec').innerText = s;
            } catch (e) { console.error("Stats Error:", e); }
        }

        // إرسال البيانات لـ Google Sheets
        document.getElementById('gsForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'جاري الحفظ...';

            // تجهيز البيانات بالأسماء المطلوبة
            const formData = new FormData();
            formData.append('الاسم الكامل', document.getElementById('fullName').value);
            formData.append('اسم الدخول', document.getElementById('loginUser').value);
            formData.append('كلمة المرور', document.getElementById('loginPass').value);
            formData.append('الدور', document.getElementById('userRole').value);
            formData.append('createdAt', new Date().toLocaleString('ar-DZ'));
            formData.append('sheetName', 'accounts');

            try {
                // استخدام وضع 'no-cors' مع FormData لضمان وصول البيانات لـ GAS
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });
                
                alert("✅ تم إرسال البيانات بنجاح إلى ملف الحسابات (accounts)");
                document.getElementById('accountModal').style.display = 'none';
                e.target.reset();
            } catch (error) {
                alert("❌ حدث خطأ في الاتصال");
            } finally {
                btn.disabled = false;
                btn.innerText = 'حفظ في الشيت';
            }
        };

        window.onload = loadStats;
    </script>
</body>
</html>
