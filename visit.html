<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الزيارات التفتيشية – نظام إدارة الزيارات</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; }
        .note-cell { white-space: normal !important; min-width: 250px; font-size: 0.85rem; color: #444; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
        #specialty { background-color: #f9fafb; font-weight: bold; color: #111827; }
        /* زر لوحة التحكم */
        .btn-dash { color: #8b5cf6 !important; border: 1px solid #8b5cf6 !important; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; margin-left: 10px; transition: 0.3s; }
        .btn-dash:hover { background: #8b5cf6; color: white !important; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
    
    <nav class="navbar">
        <div class="brand">🏫 مصلحة التفتيش - إدارة الزيارات</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <a href="dashboard.html" class="btn-dash">⚙️ لوحة التحكم</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ تسجيل زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة التعليمية</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required>
                            <option value="">-- اختر البلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <select id="institutionSelect" name="institution" required disabled>
                            <option value="">-- اختر المرحلة والبلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>التخصص (تلقائي)</label>
                        <input type="text" id="specialty" readonly />
                    </div>
                    <div class="form-group">
                        <label>اسم المعني</label>
                        <input type="text" id="visitee" required />
                    </div>
                    <div class="form-group">
                        <label>العقبات / الإجازات</label>
                        <select id="penalties">
                            <option value="لا شيء">لا شيء</option>
                            <option value="إقتراح إنذار">إقتراح إنذار</option>
                            <option value="إقتراح توبيخ">إقتراح توبيخ</option>
                            <option value="إقتراح تشجيع">إقتراح تشجيع</option>
                            <option value="إقتراح ترسيم">إقتراح ترسيم</option>
                        </select>
                    </div>
                    <div class="form-group"><label>تاريخ الزيارة</label><input type="date" id="vDate" required /></div>
                    <div class="form-group"><label>النقطة</label><input type="number" id="score" step="0.25" /></div>
                    <div class="form-group"><label>الموسم الدراسي</label><select id="season"><option selected>2025 / 2026</option></select></div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <select id="notes">
                            <option value="العمل بالتوجيهات والتوصيات المقدمة">1- العمل بالتوجيهات والتوصيات المقدمة</option>
                            <option value="تثمين الجهد المبذول">2- تثمين الجهد المبذول</option>
                            <option value="العمل على تدارك النقائص المسجلة">3- العمل على تدارك النقائص المسجلة</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-accent" id="submitBtn">📥 حفظ البيانات وإرسال للشيت</button>
                </div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 سجل الزيارات (تطابق كامل مع البيانات)</div>
            <div class="search-grid">
                <input type="text" id="searchName" placeholder="بحث بالمعني..." oninput="applySearch()" />
                <input type="text" id="searchInst" placeholder="بحث بالمؤسسة..." oninput="applySearch()" />
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المعرف</th>
                            <th>تاريخ التسجيل</th>
                            <th>المفتش</th>
                            <th>التخصص</th>
                            <th>المرحلة</th>
                            <th>اسم المعني</th>
                            <th>المؤسسة</th>
                            <th>تاريخ الزيارة</th>
                            <th>النقطة</th>
                            <th>العقبات</th>
                            <th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
            <div id="paginationControls" class="pagination"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="data.js"></script>
    <script src="visit.js"></script>
    <script>
        // رابط النشر الجديد الخاص بك
        const NEW_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNxA-jsBPMeguI5kaP8L8h5xldssUvhrSTgkTLV0xQGxQ3e-OOWR8ZRBqXr8OLJUes/exec";

        document.addEventListener('DOMContentLoaded', async () => {
            const session = requireAuth(['admin', 'inspector', 'manager']);
            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            document.getElementById('vDate').value = new Date().toISOString().split('T')[0];

            // البلديات
            const MUNICIPALITIES = ['توقرت','النزلة','تبسبست','الزاوية العابدية','تماسين','بلدة عمر','الطيبات','المنقر','بن ناصر','المقارين','سيدي سليمان','الحجيرة','العالية'];
            const munSel = document.getElementById('municipalitySelect');
            MUNICIPALITIES.sort().forEach(m => munSel.add(new Option(m, m)));

            // تحميل البيانات الأولية
            if (typeof loadVisits === 'function') await loadVisits();

            // منطق الفلاتر (كما في ملفك الأصلي)
            const stageSel = document.getElementById('stageSelect');
            const insSel = document.getElementById('inspectorSelect');
            const instSel = document.getElementById('institutionSelect');

            const filterData = async () => {
                const stage = stageSel.value;
                const mun = munSel.value;
                
                // تصفية المفتشين
                const insps = await fetchInspectors();
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                insps.filter(i => i['المرحلة'] === stage).forEach(i => insSel.add(new Option(i['الاسم'], i['الاسم'])));
                insSel.disabled = false;

                // تصفية المؤسسات من الرابط المباشر
                if (stage && mun) {
                    instSel.innerHTML = '<option value="">-- جاري التحميل... --</option>';
                    const resp = await fetch("https://script.google.com/macros/s/AKfycbwNzwChPUA8cfMmeskQhLCsLc8lSsuM8vWMkCKpDLnRADwW1iePrMeh7c3qdNfXEUBevw/exec?action=get&sheet=institutions");
                    const json = await resp.json();
                    const filtered = (Array.isArray(json) ? json : json.data).filter(i => (i['المرحلة']||'').trim() === stage && (i['البلدية']||'').trim() === mun);
                    instSel.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
                    filtered.forEach(i => instSel.add(new Option(i['اسم المؤسسة'], i['اسم المؤسسة'])));
                    instSel.disabled = false;
                }
            };

            stageSel.onchange = filterData;
            munSel.onchange = filterData;
            insSel.onchange = async () => {
                const insps = await fetchInspectors();
                const selected = insps.find(i => i['الاسم'] === insSel.value);
                document.getElementById('specialty').value = selected ? selected['التخصص'] : '';
            };

            // ── معالجة الحفظ والإرسال (الحل الناجع) ──
            document.getElementById('visitForm').onsubmit = async function(e) {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.disabled = true; btn.innerText = 'جاري الحفظ والإرسال...';

                const data = {
                    "المرحلة": stageSel.value,
                    "البلدية": munSel.value,
                    "المؤسسة": instSel.value,
                    "المفتش": insSel.value,
                    "التخصص": document.getElementById('specialty').value,
                    "المعني": document.getElementById('visitee').value,
                    "العقبات": document.getElementById('penalties').value,
                    "الملاحظة": document.getElementById('notes').value,
                    "تاريخ الزيارة": document.getElementById('vDate').value,
                    "النقطة": document.getElementById('score').value,
                    "الموسم": document.getElementById('season').value,
                    "sheetName": "visits"
                };

                try {
                    // 1. الإرسال الصامت لشيت جوجل (يتجاوز خطأ الشبكة)
                    const img = new Image();
                    img.src = `${NEW_SCRIPT_URL}?${new URLSearchParams(data).toString()}&t=${Date.now()}`;

                    // 2. الحفظ المحلي (استدعاء دالة ملف visit.js الأصلية)
                    if (typeof handleVisitSubmit === 'function') {
                        await handleVisitSubmit(e);
                    }

                    alert("✅ تم تسجيل الزيارة بنجاح في الشيت وفي الجدول");
                    this.reset();
                    document.getElementById('vDate').value = new Date().toISOString().split('T')[0];
                } catch (err) {
                    alert("⚠️ تم الحفظ محلياً فقط، يرجى التحقق من اتصال الإنترنت");
                } finally {
                    btn.disabled = false; btn.innerText = '📥 حفظ البيانات وإرسال للشيت';
                }
            };
        });
    </script>
</body>
</html>
