<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الزيارات التفتيشية – إدارة البيانات</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* تحسينات إضافية لعرض الجدول */
        .table-wrap { overflow-x: auto; margin-top: 1rem; }
        #visitsTable th, #visitsTable td { white-space: nowrap; padding: 12px; }
        .note-cell { 
            white-space: normal !important; 
            min-width: 250px; 
            max-width: 400px; 
            font-size: 0.85rem; 
            line-height: 1.4;
            color: #4b5563;
        }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="brand">🏫 نظام إدارة الزيارات</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <button class="btn btn-sm" id="refreshBtn">🔄 تحديث</button>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ إدخال زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>التخصص</label>
                        <select id="specialty" name="specialty" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required></select>
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <select id="institutionSelect" name="institution" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>اسم المعني</label>
                        <input type="text" name="visitee" required />
                    </div>
                    <div class="form-group">
                        <label>الرتبة</label>
                        <select name="rank">
                            <option>أستاذ التعليم الابتدائي</option>
                            <option>أستاذ التعليم المتوسط</option>
                            <option>أستاذ التعليم الثانوي</option>
                            <option>مدير</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" id="visitDate" name="visitDate" required />
                    </div>
                    <div class="form-group">
                        <label>النقطة</label>
                        <input type="number" name="score" step="0.25" max="20" />
                    </div>
                    <div class="form-group">
                        <label>الموسم الدراسي</label>
                        <select name="season" required>
                            <option>2024 / 2025</option>
                            <option>2025 / 2026</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <textarea id="notes" name="notes" rows="2" placeholder="اكتب ملاحظات الزيارة هنا..."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-accent">📤 حفظ الزيارة</button>
                </div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 سجل الزيارات <span id="resultsCount"></span></div>
            <div class="search-bar">
                <input type="text" id="searchName" placeholder="بحث باسم الأستاذ..." />
                <input type="text" id="searchInst" placeholder="بحث بالمؤسسة..." />
            </div>
            <div class="table-wrap">
                <table id="visitsTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المعرف</th>
                            <th>التاريخ</th>
                            <th>المفتش</th>
                            <th>التخصص</th>
                            <th>المرحلة</th>
                            <th>المعني بالزيارة</th>
                            <th>الرتبة</th>
                            <th>الدرجة</th>
                            <th>المؤسسة</th>
                            <th>تاريخ الزيارة</th>
                            <th>نوع الزيارة</th>
                            <th>النقطة</th>
                            <th>العقوبات</th>
                            <th>الموسم</th>
                            <th>الملاحظة</th> </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="data.js"></script>
    <script src="visit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof requireAuth !== 'function') return;
            const session = requireAuth(['admin', 'inspector', 'manager']);
            if (!session) return;

            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            
            // ربط حدث الإرسال برمجياً لتفادي أخطاء الـ Reference
            const form = document.getElementById('visitForm');
            if (form) form.addEventListener('submit', handleVisitSubmit);

            // تفعيل البحث والتحميل
            document.getElementById('refreshBtn').addEventListener('click', loadVisits);
            document.getElementById('searchName').addEventListener('input', applySearch);
            document.getElementById('searchInst').addEventListener('input', applySearch);

            try {
                if (typeof initFormDropdowns === 'function') await initFormDropdowns();
                await loadVisits();
            } catch (e) { console.error(e); }
        });
    </script>
</body>
</html>
