<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الزيارات التفتيشية – نظام إدارة الزيارات</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin: 20px 0; }
        .note-cell { white-space: normal !important; min-width: 250px; font-size: 0.85rem; color: #444; }
        .search-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
        #specialty { background-color: #f9fafb; font-weight: bold; color: #111827; }
        .btn-dash { color: #8b5cf6 !important; border: 1px solid #8b5cf6 !important; margin-left: 10px; text-decoration: none; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; display: inline-flex; align-items: center; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
    
    <nav class="navbar">
        <div class="brand">🏫 مصلحة التفتيش - إدارة الزيارات</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <a href="dashboard.html" class="btn-dash">⚙️ لوحة التحكم</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ تسجيل زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة التعليمية</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required>
                            <option value="">-- اختر البلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <select id="institutionSelect" name="institution" required disabled>
                            <option value="">-- اختر المرحلة والبلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>
                    <div class="form-group"><label>التخصص</label><input type="text" id="specialty" readonly /></div>
                    <div class="form-group"><label>اسم المعني</label><input type="text" id="visitee" required /></div>
                    <div class="form-group">
                        <label>العقبات / الإجازات</label>
                        <select id="penalties" name="penalties">
                            <option value="لا شيء">لا شيء</option>
                            <option value="إقتراح إنذار">إقتراح إنذار</option>
                            <option value="إقتراح توبيخ">إقتراح توبيخ</option>
                            <option value="إقتراح تشجيع">إقتراح تشجيع</option>
                            <option value="إقتراح ترسيم">إقتراح ترسيم</option>
                        </select>
                    </div>
                    <div class="form-group"><label>تاريخ الزيارة</label><input type="date" id="vDate" required /></div>
                    <div class="form-group"><label>النقطة</label><input type="number" id="score" step="0.25" /></div>
                    <div class="form-group"><label>الموسم</label><select id="season"><option selected>2025 / 2026</option></select></div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <select id="notes">
                            <option value="العمل بالتوجيهات والتوصيات المقدمة">العمل بالتوجيهات والتوصيات المقدمة</option>
                            <option value="تثمين الجهد المبذول">تثمين الجهد المبذول</option>
                            <option value="تدارك النقائص المسجلة">تدارك النقائص المسجلة</option>
                        </select>
                    </div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-accent" id="submitBtn">📥 حفظ البيانات</button></div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 سجل الزيارات</div>
            <div class="search-grid">
                <input type="text" id="searchName" placeholder="بحث بالاسم..." oninput="applySearch()" />
                <input type="text" id="searchInst" placeholder="بحث بالمؤسسة..." oninput="applySearch()" />
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>المفتش</th>
                            <th>التخصص</th>
                            <th>المرحلة</th>
                            <th>المؤسسة</th>
                            <th>المعني بالزيارة</th>
                            <th>تاريخ الزيارة</th>
                            <th>النقطة</th>
                            <th>العقبات</th>
                            <th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
            <div id="paginationControls" class="pagination"></div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="data.js"></script>
    <script src="visit.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhFYuFdSudyuoDEd5npce03XBJ1kNvGsi1tmxrISa-1N8T7XNClxs9P4QDtGzK53-_Uw/exec";
        
        let _institutionsList = [];
        let _inspectorsList = [];

        document.addEventListener('DOMContentLoaded', async () => {
            requireAuth(['admin', 'inspector', 'manager']);
            document.getElementById('vDate').value = new Date().toISOString().split('T')[0];

            // تعبئة البلديات والبيانات
            const MUNICIPALITIES = ['توقرت','النزلة','تبسبست','الزاوية العابدية','تماسين','بلدة عمر','الطيبات','المنقر','بن ناصر','المقارين','سيدي سليمان','الحجيرة','العالية'];
            const munSel = document.getElementById('municipalitySelect');
            MUNICIPALITIES.sort().forEach(m => munSel.add(new Option(m, m)));

            try {
                const insps = await fetchInspectors();
                _inspectorsList = insps;
                const instResp = await fetch("https://script.google.com/macros/s/AKfycbwNzwChPUA8cfMmeskQhLCsLc8lSsuM8vWMkCKpDLnRADwW1iePrMeh7c3qdNfXEUBevw/exec?action=get&sheet=institutions");
                const instJson = await instResp.json();
                _institutionsList = Array.isArray(instJson) ? instJson : (instJson.data || []);
                if(typeof loadVisits === 'function') await loadVisits();
            } catch (e) { console.error(e); }

            // منطق الفلاتر (المرحلة -> البلدية -> المؤسسة)
            const stageSel = document.getElementById('stageSelect');
            const insSel = document.getElementById('inspectorSelect');
            const instSel = document.getElementById('institutionSelect');

            const filterDropdowns = () => {
                const stage = stageSel.value;
                const mun = munSel.value;
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                _inspectorsList.filter(i => i['المرحلة'] === stage).forEach(i => insSel.add(new Option(i['الاسم'], i['الاسم'])));
                insSel.disabled = false;
                if (stage && mun) {
                    instSel.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
                    _institutionsList.filter(i => (i['المرحلة']||'').trim() === stage && (i['البلدية']||'').trim() === mun)
                                     .forEach(i => instSel.add(new Option(i['اسم المؤسسة'], i['اسم المؤسسة'])));
                    instSel.disabled = false;
                }
            };
            stageSel.onchange = filterDropdowns;
            munSel.onchange = filterDropdowns;
            insSel.onchange = () => {
                const insp = _inspectorsList.find(i => i['الاسم'] === insSel.value);
                document.getElementById('specialty').value = insp ? insp['التخصص'] : '';
            };

            // الحل الناجع للإرسال: استخدام Image Beacon لتفادي خطأ CORS تماماً
            document.getElementById('visitForm').onsubmit = async function(e) {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.disabled = true; btn.innerText = 'جاري الحفظ...';

                const data = {
                    "المرحلة": stageSel.value,
                    "البلدية": munSel.value,
                    "المؤسسة": instSel.value,
                    "المفتش": insSel.value,
                    "التخصص": document.getElementById('specialty').value,
                    "المعني": document.getElementById('visitee').value,
                    "العقبات": document.getElementById('penalties').value,
                    "الملاحظة": document.getElementById('notes').value,
                    "تاريخ الزيارة": document.getElementById('vDate').value,
                    "النقطة": document.getElementById('score').value,
                    "الموسم": document.getElementById('season').value,
                    "sheetName": "visits"
                };

                const q = new URLSearchParams(data).toString();
                
                // إرسال صامت (Silent Send) لتجنب أخطاء الشبكة في المتصفح
                const img = new Image();
                img.src = `${SCRIPT_URL}?${q}&t=${Date.now()}`;

                // تنفيذ الحفظ المحلي فوراً لضمان ظهور البيانات في الجدول
                if (typeof handleVisitSubmit === 'function') await handleVisitSubmit(e);
                
                alert("✅ تم الحفظ بنجاح وتحديث الجدول");
                this.reset();
                btn.disabled = false; btn.innerText = '📥 حفظ البيانات';
            };
        });
    </script>
</body>
</html>
