<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الزيارات التفتيشية</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 20px 0; }
        .note-cell { white-space: normal !important; min-width: 250px; font-size: 0.85rem; color: #444; }
        .search-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 20px; }
        #specialty { background-color: #f3f4f6; font-weight: bold; color: #1e40af; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
    
    <nav class="navbar">
        <div class="brand">🏫 مصلحة التكوين والتفتيش - الزيارات</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ إدخال زيارة تفتيشية جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة التعليمية</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required>
                            <option value="">-- اختر البلدية --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>المؤسسة التعليمية</label>
                        <select id="institutionSelect" name="institution" required disabled>
                            <option value="">-- اختر المرحلة والبلدية أولاً --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>اسم المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>

                    <div class="form-group">
                        <label>التخصص (تلقائي)</label>
                        <input type="text" id="specialty" readonly />
                    </div>

                    <div class="form-group">
                        <label>اسم المعني بالزيارة</label>
                        <input type="text" name="visitee" required />
                    </div>

                    <div class="form-group">
                        <label>العقبات / الإجازات</label>
                        <select name="penalties">
                            <option value="لا شيء">لا شيء</option>
                            <option value="إقتراح إنذار">إقتراح إنذار</option>
                            <option value="إقتراح توبيخ">إقتراح توبيخ</option>
                            <option value="إقتراح تشجيع">إقتراح تشجيع</option>
                            <option value="إقتراح ترسيم">إقتراح ترسيم</option>
                            <option value="إقتراح تأجيل">إقتراح تأجيل</option>
                            <option value="إقتراح تشكيل لجنة تحقيق">إقتراح تشكيل لجنة تحقيق</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <select name="notes">
                            <option value="العمل بالتوجيهات والتوصيات المقدمة">1- العمل بالتوجيهات والتوصيات المقدمة</option>
                            <option value="تثمين الجهد المبذول">2- تثمين الجهد المبذول</option>
                            <option value="العمل على تدارك النقائص المسجلة">3- العمل على تدارك النقائص المسجلة</option>
                            <option value="العمل على تدارك النقائص المسجلة في انتظار قرارات الوصاية">4- العمل على تدارك النقائص المسجلة في انتظار قرارات الوصاية</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" id="visitDate" name="visitDate" required />
                    </div>
                    <div class="form-group"><label>النقطة</label><input type="number" name="score" step="0.25" /></div>
                    <div class="form-group"><label>الموسم</label><select name="season"><option selected>2025 / 2026</option></select></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-accent">📥 حفظ البيانات</button></div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 البحث المتقدم في السجلات</div>
            <div class="search-container">
                <input type="text" id="searchName" placeholder="بحث باسم المعني..." oninput="applySearch()" />
                <input type="text" id="searchInst" placeholder="بحث بالمؤسسة..." oninput="applySearch()" />
                <input type="text" id="searchInspector" placeholder="بحث باسم المفتش..." oninput="applySearch()" />
            </div>
            
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th><th>المعرف</th><th>توقيت الإدخال</th><th>المفتش</th><th>التخصص</th><th>المرحلة</th>
                            <th>المعني</th><th>الرتبة</th><th>الدرجة</th><th>المؤسسة</th><th>التاريخ</th>
                            <th>النوع</th><th>النقطة</th><th>العقبات</th><th>الموسم</th><th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
            <div id="paginationControls" class="pagination"></div>
        </div>
    </div>

    <script src="app.js"></script><script src="data.js"></script><script src="visit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = requireAuth(['admin', 'inspector', 'manager']);
            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];

            // البلديات المطلوبة
            const MUNICIPALITIES = ['توقرت','النزلة','تبسبست','الزاوية العابدية','تماسين','بلدة عمر','الطيبات','المنقر','بن ناصر','المقارين','سيدي سليمان','الحجيرة','العالية'];
            const munSel = document.getElementById('municipalitySelect');
            MUNICIPALITIES.sort().forEach(m => munSel.add(new Option(m, m)));

            const [inspectors, institutions] = await Promise.all([fetchInspectors(), fetchInstitutions()]);
            
            const stageSel = document.getElementById('stageSelect');
            const insSel = document.getElementById('inspectorSelect');
            const instSel = document.getElementById('institutionSelect');

            function filterLists() {
                const stage = stageSel.value;
                const mun = munSel.value;

                // 1. فلترة المفتشين حسب المرحلة
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                inspectors.filter(i => i['المرحلة'] === stage).forEach(i => insSel.add(new Option(i['الاسم'], i['الاسم'])));
                insSel.disabled = false;

                // 2. فلترة المؤسسات حسب (المرحلة + البلدية)
                if (stage && mun) {
                    instSel.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
                    const filtered = institutions.filter(i => i['المرحلة'] === stage && i['البلدية'] === mun);
                    filtered.forEach(i => instSel.add(new Option(i['اسم المؤسسة'], i['اسم المؤسسة'])));
                    instSel.disabled = false;
                    if(filtered.length === 0) instSel.innerHTML = '<option>⚠️ لا توجد مؤسسات</option>';
                }
            }

            stageSel.addEventListener('change', filterLists);
            munSel.addEventListener('change', filterLists);
            insSel.addEventListener('change', () => {
                const insp = inspectors.find(i => i['الاسم'] === insSel.value);
                document.getElementById('specialty').value = insp ? insp['التخصص'] : '';
            });

            document.getElementById('visitForm').addEventListener('submit', handleVisitSubmit);
            await loadVisits();
        });
    </script>
</body>
</html>
