<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الزيارات - سعداوي زين العابدين</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .note-cell { white-space: normal !important; min-width: 250px; max-width: 400px; font-size: 0.85rem; color: #4b5563; line-height: 1.5; }
        .table-wrap { overflow-x: auto; margin-top: 1rem; border-radius: 8px; border: 1px solid #e5e7eb; }
        #visitsTable th { background-color: #f9fafb; color: #374151; font-weight: 600; }
        #specialty[readonly] { background-color: #f3f4f6; cursor: not-allowed; border-color: #d1d5db; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="brand">🏫 نظام إدارة الزيارات التفتيشية</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ تسجيل زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة التعليمية</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>اسم المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled>
                            <option value="">-- اختر المرحلة أولاً --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>التخصص (تلقائي)</label>
                        <input type="text" id="specialty" name="specialty" readonly placeholder="سيظهر تلقائياً" />
                    </div>

                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required>
                            <option value="">-- اختر البلدية --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>المؤسسة التعليمية</label>
                        <select id="institutionSelect" name="institution" required disabled>
                            <option value="">-- اختر البلدية والمرحلة --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>اسم المعني بالزيارة</label>
                        <input type="text" name="visitee" required placeholder="اسم الأستاذ" />
                    </div>

                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" name="visitDate" required id="defaultDate" />
                    </div>

                    <div class="form-group">
                        <label>النقطة /20</label>
                        <input type="number" name="score" step="0.25" max="20" placeholder="00.00" />
                    </div>

                    <div class="form-group">
                        <label>الموسم الدراسي</label>
                        <select name="season" required>
                            <option>2024 / 2025</option>
                            <option selected>2025 / 2026</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>ملاحظات الزيارة</label>
                        <textarea id="notes" name="notes" rows="2" placeholder="اكتب ملاحظاتك هنا..."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-accent">📤 حفظ الزيارة</button>
                </div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 سجل الزيارات <span id="resultsCount" style="font-size: 0.9rem; font-weight: normal;"></span></div>
            <div class="search-bar">
                <input type="text" id="searchName" placeholder="بحث باسم المعني..." />
            </div>
            <div class="table-wrap">
                <table id="visitsTable">
                    <thead>
                        <tr>
                            <th>#</th><th>المعرف</th><th>التوقيت</th><th>المفتش</th><th>التخصص</th><th>المرحلة</th>
                            <th>المعني</th><th>الرتبة</th><th>الدرجة</th><th>المؤسسة</th><th>تاريخ الزيارة</th>
                            <th>النوع</th><th>النقطة</th><th>العقوبات</th><th>الموسم</th><th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script><script src="data.js"></script><script src="visit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = requireAuth(['admin', 'inspector', 'manager']);
            if (!session) return;
            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            document.getElementById('defaultDate').value = new Date().toISOString().split('T')[0];

            const MUNICIPALITIES = ['توقرت', 'النزلة', 'تبسبست', 'الزاوية العابدية', 'تماسين', 'بلدة عمر', 'المنقر', 'الطيبات', 'بن ناصر', 'المقارين', 'سيدي سليمان', 'الحجيرة', 'العالية'];
            
            // تهيئة البلديات
            const munSel = document.getElementById('municipalitySelect');
            MUNICIPALITIES.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                munSel.appendChild(opt);
            });

            // جلب البيانات الأساسية
            const [inspectors, institutions] = await Promise.all([fetchInspectors(), fetchInstitutions()]);
            _inspectorsList = inspectors;

            // 1. منطق تغيير المرحلة (يفلتر المفتشين والمؤسسات)
            document.getElementById('stageSelect').addEventListener('change', function() {
                const stage = this.value;
                const insSel = document.getElementById('inspectorSelect');
                
                const filteredIns = inspectors.filter(i => i['المرحلة'] === stage);
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                filteredIns.forEach(i => {
                    const opt = document.createElement('option'); opt.value = i['الاسم']; opt.textContent = i['الاسم'];
                    insSel.appendChild(opt);
                });
                insSel.disabled = false;
                updateInstitutions(stage, munSel.value, institutions);
            });

            // 2. منطق التخصص التلقائي (عند اختيار المفتش)
            document.getElementById('inspectorSelect').addEventListener('change', function() {
                const insData = _inspectorsList.find(i => i['الاسم'] === this.value);
                document.getElementById('specialty').value = insData ? insData['التخصص'] : '';
            });

            // 3. منطق تغيير البلدية
            munSel.addEventListener('change', () => {
                updateInstitutions(document.getElementById('stageSelect').value, munSel.value, institutions);
            });

            function updateInstitutions(stage, municipality, list) {
                const instSel = document.getElementById('institutionSelect');
                if (!stage || !municipality) return;
                const filtered = list.filter(i => i['المرحلة'] === stage && i['البلدية'] === municipality);
                instSel.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
                filtered.forEach(i => {
                    const opt = document.createElement('option'); opt.value = i['اسم المؤسسة']; opt.textContent = i['اسم المؤسسة'];
                    instSel.appendChild(opt);
                });
                instSel.disabled = false;
            }

            document.getElementById('visitForm').addEventListener('submit', handleVisitSubmit);
            document.getElementById('searchName').addEventListener('input', applySearch);
            await loadVisits();
        });
    </script>
</body>
</html>
