<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الزيارات التفتيشية – مصلحة التكوين والتفتيش</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .note-cell { white-space: normal !important; min-width: 250px; color: #444; font-size: 0.85rem; }
        #specialty[readonly] { background-color: #f3f4f6; border-color: #d1d5db; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .full-width { grid-column: 1 / -1; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>

    <nav class="navbar">
        <div class="brand">🏫 نظام إدارة الزيارات التفتيشية</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ تسجيل زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة التعليمية</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>التخصص (تلقائي)</label>
                        <input type="text" id="specialty" name="specialty" readonly />
                    </div>
                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required>
                            <option value="">-- اختر البلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <select id="institutionSelect" name="institution" required disabled>
                            <option value="">-- اختر المرحلة والبلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>اسم المعني</label>
                        <input type="text" name="visitee" required />
                    </div>
                    <div class="form-group">
                        <label>الرتبة</label>
                        <input type="text" name="rank" />
                    </div>
                    <div class="form-group">
                        <label>الدرجة</label>
                        <input type="text" name="grade" />
                    </div>
                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" id="vDate" name="visitDate" required />
                    </div>
                    <div class="form-group">
                        <label>نوع الزيارة</label>
                        <select name="visitType">
                            <option>تثبيت</option>
                            <option>توجيه</option>
                            <option>تفتيش</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>النقطة</label>
                        <input type="number" name="score" step="0.25" />
                    </div>
                    <div class="form-group">
                        <label>العقوبات</label>
                        <input type="text" name="penalties" />
                    </div>
                    <div class="form-group">
                        <label>الموسم الدراسي</label>
                        <select name="season" required>
                            <option selected>2025 / 2026</option>
                            <option>2024 / 2025</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-accent">📥 حفظ البيانات</button></div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 البحث في السجلات <span id="resultsCount"></span></div>
            <div class="form-grid" style="margin-bottom: 15px;">
                <input type="text" id="searchName" placeholder="بحث باسم المعني..." />
                <input type="text" id="searchInst" placeholder="بحث بالمؤسسة..." />
            </div>
            <div class="table-wrap">
                <table id="visitsTable">
                    <thead>
                        <tr>
                            <th>#</th><th>المعرف</th><th>توقيت الإدخال</th><th>المفتش</th><th>التخصص</th><th>المرحلة</th>
                            <th>المعني</th><th>الرتبة</th><th>الدرجة</th><th>المؤسسة</th><th>تاريخ الزيارة</th>
                            <th>النوع</th><th>النقطة</th><th>العقوبات</th><th>الموسم</th><th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script><script src="data.js"></script><script src="visit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = requireAuth(['admin', 'inspector', 'manager']);
            if (!session) return;
            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            document.getElementById('vDate').value = new Date().toISOString().split('T')[0];

            // 1. جلب البيانات الأساسية مع تمديد المهلة
            const [inspectors, institutions] = await Promise.all([
                fetchInspectors().catch(() => []),
                fetchInstitutions().catch(() => [])
            ]);

            // 2. تعبئة البلديات بشكل فريد
            const munSel = document.getElementById('municipalitySelect');
            const uniqueMuns = [...new Set(institutions.map(i => i['البلدية']))].sort();
            munSel.innerHTML = '<option value="">-- اختر البلدية --</option>';
            uniqueMuns.forEach(m => {
                if(m) { const opt = document.createElement('option'); opt.value = m; opt.textContent = m; munSel.appendChild(opt); }
            });

            // 3. منطق الفلترة (المرحلة والمفتش)
            const stageSel = document.getElementById('stageSelect');
            const insSel = document.getElementById('inspectorSelect');
            const instSel = document.getElementById('institutionSelect');

            function updateDropdowns() {
                const stage = stageSel.value;
                const mun = munSel.value;

                // فلترة المفتشين
                const fIns = inspectors.filter(i => i['المرحلة'] === stage);
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                fIns.forEach(i => {
                    const opt = document.createElement('option'); opt.value = i['الاسم']; opt.textContent = i['الاسم'];
                    insSel.appendChild(opt);
                });
                insSel.disabled = false;

                // فلترة المؤسسات (المرحلة + البلدية)
                if(stage && mun) {
                    const fInst = institutions.filter(i => i['المرحلة'] === stage && i['البلدية'] === mun);
                    instSel.innerHTML = `<option value="">-- اختر المؤسسة (${fInst.length}) --</option>`;
                    fInst.forEach(i => {
                        const opt = document.createElement('option'); opt.value = i['اسم المؤسسة']; opt.textContent = i['اسم المؤسسة'];
                        instSel.appendChild(opt);
                    });
                    instSel.disabled = false;
                }
            }

            stageSel.addEventListener('change', updateDropdowns);
            munSel.addEventListener('change', updateDropdowns);
            
            // التخصص التلقائي
            insSel.addEventListener('change', () => {
                const data = inspectors.find(i => i['الاسم'] === insSel.value);
                document.getElementById('specialty').value = data ? data['التخصص'] : '';
            });

            document.getElementById('visitForm').addEventListener('submit', handleVisitSubmit);
            document.getElementById('searchName').addEventListener('input', applySearch);
            document.getElementById('searchInst').addEventListener('input', applySearch);

            await loadVisits();
        });
    </script>
</body>
</html>
