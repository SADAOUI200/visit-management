<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إدارة الزيارات التفتيشية</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; padding: 10px; }
        .note-cell { white-space: normal !important; min-width: 250px; font-size: 0.85rem; color: #444; }
        #specialty[readonly] { background-color: #f3f4f6; }
        .search-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        /* إضافة زر العودة للوحة التحكم */
        .btn-dash { color: #8b5cf6 !important; border: 1px solid #8b5cf6 !important; text-decoration: none; padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
    <nav class="navbar">
        <div class="brand">🏫 نظام إدارة الزيارات</div>
        <div class="nav-links">
            <span id="navUserInfo"></span>
            <a href="dashboard.html" class="btn-dash">⚙️ لوحة التحكم</a>
            <button class="btn btn-danger btn-sm" onclick="logout()">خروج</button>
        </div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ تسجيل زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة التعليمية</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر المرحلة --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>البلدية</label>
                        <select id="municipalitySelect" name="municipality" required>
                            <option value="">-- اختر البلدية --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <select id="institutionSelect" name="institution" required disabled>
                            <option value="">-- اختر المرحلة والبلدية أولاً --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>التخصص (تلقائي)</label>
                        <input type="text" id="specialty" readonly />
                    </div>
                    <div class="form-group">
                        <label>اسم المعني</label>
                        <input type="text" id="visitee" required />
                    </div>
                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" id="vDate" required />
                    </div>
                    <div class="form-group">
                        <label>العقبات / الإجازات</label>
                        <select id="penalties">
                            <option value="لا شيء">لا شيء</option>
                            <option value="إقتراح إنذار">إقتراح إنذار</option>
                            <option value="إقتراح توبيخ">إقتراح توبيخ</option>
                            <option value="إقتراح تشجيع">إقتراح تشجيع</option>
                            <option value="إقتراح ترسيم">إقتراح ترسيم</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <select id="notes">
                            <option value="العمل بالتوجيهات والتوصيات المقدمة">1- العمل بالتوجيهات والتوصيات المقدمة</option>
                            <option value="تثمين الجهد المبذول">2- تثمين الجهد المبذول</option>
                            <option value="العمل على تدارك النقائص المسجلة">3- العمل على تدارك النقائص المسجلة</option>
                        </select>
                    </div>
                    <div class="form-group"><label>النقطة</label><input type="number" id="score" step="0.25" /></div>
                    <div class="form-group"><label>الموسم</label><select id="season"><option selected>2025 / 2026</option></select></div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-accent" id="submitBtn">📥 حفظ البيانات وإرسال للشيت</button></div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 سجل الزيارات</div>
            <div class="search-grid">
                <input type="text" id="searchName" placeholder="بحث بالاسم..." oninput="applySearch()" />
                <input type="text" id="searchInst" placeholder="بحث بالمؤسسة..." oninput="applySearch()" />
                <input type="text" id="searchInspector" placeholder="بحث بالمفتش..." oninput="applySearch()" />
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th><th>المعرف</th><th>التوقيت</th><th>المفتش</th><th>التخصص</th><th>المرحلة</th>
                            <th>المعني</th><th>الرتبة</th><th>الدرجة</th><th>المؤسسة</th><th>التاريخ</th>
                            <th>النوع</th><th>النقطة</th><th>العقبات</th><th>الموسم</th><th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
            <div id="paginationControls" class="pagination"></div>
        </div>
    </div>

    <script src="app.js"></script><script src="data.js"></script><script src="visit.js"></script>
    <script>
        // رابط النشر الجديد الذي زودتني به
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNxA-jsBPMeguI5kaP8L8h5xldssUvhrSTgkTLV0xQGxQ3e-OOWR8ZRBqXr8OLJUes/exec";

        document.addEventListener('DOMContentLoaded', async () => {
            const session = requireAuth(['admin', 'inspector', 'manager']);
            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            document.getElementById('vDate').value = new Date().toISOString().split('T')[0];

            const [inspectors, institutions] = await Promise.all([fetchInspectors(), fetchInstitutions()]);
            
            const munSel = document.getElementById('municipalitySelect');
            const uniqueMuns = [...new Set(institutions.map(i => i['البلدية']))].sort();
            uniqueMuns.forEach(m => { if(m){const opt = new Option(m, m); munSel.add(opt);} });

            const stageSel = document.getElementById('stageSelect');
            const insSel = document.getElementById('inspectorSelect');
            const instSel = document.getElementById('institutionSelect');

            function filterLists() {
                const stage = stageSel.value;
                const mun = munSel.value;
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                inspectors.filter(i => i['المرحلة'] === stage).forEach(i => insSel.add(new Option(i['الاسم'], i['الاسم'])));
                insSel.disabled = false;
                if (stage && mun) {
                    instSel.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
                    institutions.filter(i => i['المرحلة'] === stage && i['البلدية'] === mun)
                               .forEach(i => instSel.add(new Option(i['اسم المؤسسة'], i['اسم المؤسسة'])));
                    instSel.disabled = false;
                }
            }

            stageSel.addEventListener('change', filterLists);
            munSel.addEventListener('change', filterLists);
            insSel.addEventListener('change', () => {
                const insp = inspectors.find(i => i['الاسم'] === insSel.value);
                document.getElementById('specialty').value = insp ? insp['التخصص'] : '';
            });

            // معالجة الإرسال والحفظ
            document.getElementById('visitForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const btn = document.getElementById('submitBtn');
                btn.disabled = true; btn.innerText = 'جاري الإرسال...';

                const data = {
                    "المرحلة": stageSel.value,
                    "البلدية": munSel.value,
                    "المؤسسة": instSel.value,
                    "المفتش": insSel.value,
                    "التخصص": document.getElementById('specialty').value,
                    "المعني": document.getElementById('visitee').value,
                    "العقبات": document.getElementById('penalties').value,
                    "الملاحظة": document.getElementById('notes').value,
                    "تاريخ الزيارة": document.getElementById('vDate').value,
                    "النقطة": document.getElementById('score').value,
                    "الموسم": document.getElementById('season').value,
                    "sheetName": "visits"
                };

                try {
                    // إرسال البيانات (طريقة الـ Image Beacon لتجنب أخطاء CORS)
                    const img = new Image();
                    img.src = `${SCRIPT_URL}?${new URLSearchParams(data).toString()}&t=${Date.now()}`;

                    // استدعاء دالة الحفظ المحلي الأصلية الموجودة في visit.js
                    if(typeof handleVisitSubmit === 'function') {
                        await handleVisitSubmit(e);
                    }
                    
                    alert("✅ تم الحفظ محلياً وإرسال البيانات لـ Google Sheets");
                    this.reset();
                    document.getElementById('vDate').value = new Date().toISOString().split('T')[0];
                } catch (err) {
                    alert("⚠️ خطأ في الاتصال، سيتم الحفظ محلياً فقط");
                } finally {
                    btn.disabled = false; btn.innerText = '📥 حفظ البيانات وإرسال للشيت';
                }
            });

            await loadVisits();
        });
    </script>
</body>
</html>
