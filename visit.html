<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <title>نظام إدارة الزيارات - سعداوي زين العابدين</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .note-cell { white-space: normal !important; min-width: 200px; max-width: 350px; font-size: 0.85rem; color: #555; }
        .table-wrap { overflow-x: auto; }
        #visitsTable th, #visitsTable td { white-space: nowrap; text-align: right; }
    </style>
</head>
<body>
    <div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
    
    <nav class="navbar">
        <div class="brand">🏫 نظام إدارة الزيارات</div>
        <div class="nav-links"><span id="navUserInfo"></span><button class="btn btn-danger btn-sm" onclick="logout()">خروج</button></div>
    </nav>

    <div class="container">
        <div class="card fade-in">
            <div class="card-title">✏️ تسجيل زيارة جديدة</div>
            <form id="visitForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>المرحلة</label>
                        <select id="stageSelect" name="stage" required>
                            <option value="">-- اختر --</option>
                            <option value="ابتدائي">ابتدائي</option>
                            <option value="متوسط">متوسط</option>
                            <option value="ثانوي">ثانوي</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>المفتش</label>
                        <select id="inspectorSelect" name="inspector" required disabled></select>
                    </div>
                    <div class="form-group">
                        <label>التخصص (تلقائي)</label>
                        <input type="text" id="specialty" name="specialty" readonly style="background:#f3f4f6;" placeholder="سيظهر تلقائياً" />
                    </div>
                    <div class="form-group">
                        <label>المؤسسة</label>
                        <select id="institutionSelect" name="institution" required disabled>
                           <option value="">-- اختر المرحلة أولاً --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>اسم المعني</label>
                        <input type="text" name="visitee" required />
                    </div>
                    <div class="form-group">
                        <label>تاريخ الزيارة</label>
                        <input type="date" name="visitDate" required />
                    </div>
                    <div class="form-group">
                        <label>النقطة</label>
                        <input type="number" name="score" step="0.25" max="20" />
                    </div>
                    <div class="form-group">
                        <label>الموسم</label>
                        <select name="season" required>
                            <option>2024 / 2025</option>
                            <option>2025 / 2026</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>الملاحظة</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                </div>
                <div class="form-actions"><button type="submit" class="btn btn-accent">📥 حفظ البيانات</button></div>
            </form>
        </div>

        <div class="card fade-in">
            <div class="card-title">🔍 سجل الزيارات</div>
            <div class="table-wrap">
                <table id="visitsTable">
                    <thead>
                        <tr>
                            <th>#</th><th>المعرف</th><th>التاريخ</th><th>المفتش</th><th>التخصص</th><th>المرحلة</th>
                            <th>المعني</th><th>الرتبة</th><th>الدرجة</th><th>المؤسسة</th><th>تاريخ الزيارة</th>
                            <th>النوع</th><th>النقطة</th><th>العقوبات</th><th>الموسم</th><th>الملاحظة</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script><script src="data.js"></script><script src="visit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = requireAuth(['admin', 'inspector', 'manager']);
            if (!session) return;
            document.getElementById('navUserInfo').innerHTML = `مرحباً <strong>${session.name}</strong>`;
            
            // تحميل المفتشين والمؤسسات
            const inspectors = await fetchInspectors();
            const institutions = await fetchInstitutions();
            _inspectorsList = inspectors; // تخزينها للاستخدام لاحقاً

            // منطق اختيار المرحلة
            document.getElementById('stageSelect').addEventListener('change', function() {
                const stage = this.value;
                const insSel = document.getElementById('inspectorSelect');
                const instSel = document.getElementById('institutionSelect');
                
                // فلترة المفتشين
                const filteredIns = inspectors.filter(i => i['المرحلة'] === stage);
                insSel.innerHTML = '<option value="">-- اختر المفتش --</option>';
                filteredIns.forEach(i => {
                    const opt = document.createElement('option');
                    opt.value = i['الاسم']; opt.textContent = i['الاسم'];
                    insSel.appendChild(opt);
                });
                insSel.disabled = false;

                // فلترة المؤسسات
                const filteredInst = institutions.filter(i => i['المرحلة'] === stage);
                instSel.innerHTML = '<option value="">-- اختر المؤسسة --</option>';
                filteredInst.forEach(i => {
                    const opt = document.createElement('option');
                    opt.value = i['اسم المؤسسة']; opt.textContent = i['اسم المؤسسة'];
                    instSel.appendChild(opt);
                });
                instSel.disabled = false;
            });

            // منطق التخصص التلقائي (حل المشكلة رقم 2)
            document.getElementById('inspectorSelect').addEventListener('change', function() {
                const selectedName = this.value;
                const inspectorData = _inspectorsList.find(i => i['الاسم'] === selectedName);
                const specialtyInput = document.getElementById('specialty');
                if (inspectorData) {
                    specialtyInput.value = inspectorData['التخصص'] || 'غير محدد';
                } else {
                    specialtyInput.value = '';
                }
            });

            const form = document.getElementById('visitForm');
            if (form) form.addEventListener('submit', handleVisitSubmit);
            
            await loadVisits();
        });
    </script>
</body>
</html>
